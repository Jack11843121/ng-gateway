# =============================================================================
# NG 网关 · 一键编排（etcd 配置中心 + 数据面 + 控制面）
# 数据面 NG_CONFIG_BACKEND=etcd 读取 /ng/gateway/config；控制面 ETCD_ENDPOINTS 写入同 key。
# 预构建镜像：ng-gateway-data-plane / ng-gateway-control-plane（GH Actions 构建并 docker save）。
# =============================================================================
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: ng-gateway-etcd
    restart: unless-stopped
    command: >
      etcd --name ng-etcd
      --advertise-client-urls http://etcd:2379
      --listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd-data
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data

  data-plane:
    image: ng-gateway-data-plane:1.0.0
    container_name: ng-gateway-data-plane
    restart: unless-stopped
    depends_on:
      - etcd
    environment:
      NG_CONFIG_BACKEND: "etcd"
      ETCD_ENDPOINTS: "http://etcd:2379"
    ports:
      - "8080:8080"      # 网关数据面
      - "9091:9091"      # Prometheus /metrics

  control-plane:
    image: ng-gateway-control-plane:1.0.0
    container_name: ng-gateway-control-plane
    restart: unless-stopped
    depends_on:
      - etcd
    environment:
      ETCD_ENDPOINTS: "http://etcd:2379"
    ports:
      - "8081:8081"      # 管理端 Admin API + 控制台

volumes:
  etcd-data: