# =============================================================================
# NG 网关 · 一键编排（M1：数据面 + 控制面，etcd 延迟到 M2）
# 数据面默认读取本地 config.json（镜像内置示例，生产用 volume 挂载覆盖）。
# 预构建镜像：ng-gateway-data-plane / ng-gateway-control-plane（GH Actions 构建并 docker save）。
# =============================================================================
services:
  data-plane:
    image: ng-gateway-data-plane:1.0.0
    container_name: ng-gateway-data-plane
    restart: unless-stopped
    environment:
      NG_CONFIG_BACKEND: "file"
      NG_GATEWAY_CONFIG: "/usr/local/ng-gateway/conf/config.json"
    ports:
      - "8080:8080"      # 网关数据面
      - "9091:9091"      # Prometheus /metrics
    volumes:
      - ./config.json:/usr/local/ng-gateway/conf/config.json:ro

  control-plane:
    image: ng-gateway-control-plane:1.0.0
    container_name: ng-gateway-control-plane
    restart: unless-stopped
    ports:
      - "8081:8081"      # 管理端 Admin API