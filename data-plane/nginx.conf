# =============================================================================
# NG 网关 · 数据面（OpenResty / Nginx + LuaJIT）
# 说明：本文件是「引擎配置」。动态路由/上游/插件均在 Lua 中处理，无需为本文件写死业务。
# 部署目录约定：/usr/local/ng-gateway/{nginx.conf,conf/,lua/}
# =============================================================================
worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Lua 包路径（ng-gateway 代码目录）
    lua_package_path "/usr/local/ng-gateway/lua/?.lua;/usr/local/ng-gateway/lua/?/init.lua;;";

    # 共享内存：配置缓存 / 限流计数 / 指标
    lua_shared_dict ng_router 10m;
    lua_shared_dict ng_counters 20m;
    lua_shared_dict ng_metrics 20m;

    resolver 8.8.8.8 114.114.114.114 valid=30s;

    # 日志/连接等基础优化
    sendfile on;
    keepalive_timeout 65;
    client_body_timeout 30s;
    client_max_body_size 20m;

    # 启动：注册插件 + 加载 bootstrap 配置
    init_by_lua_block {
        require("ng_gateway").init()
    }
    init_worker_by_lua_block {
        require("ng_gateway").init_worker()
    }

    # 指标端点（Prometheus）
    server {
        listen 9091;
        server_name _;
        location /metrics {
            content_by_lua_block { require("ng_gateway").metrics() }
        }
    }

    # 网关数据面主入口
    server {
        listen 8080 default_server;
        server_name _;

        # 动态路由：access 阶段执行插件链；upstream 内 balancer 阶段动态选上游
        location / {
            access_by_lua_block   { require("ng_gateway").access() }
            log_by_lua_block      { require("ng_gateway").log() }

            proxy_pass http://ng_dynamic_upstream;   # 占位，由 balancer 覆盖
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # 本地健康探针（数据面自身）
        location = /__ng_health {
            default_type text/plain;
            content_by_lua_block { ngx.say("ok") }
        }
    }

    # ng_dynamic_upstream 仅为 proxy_pass 提供合法目标，实际由 balancer_by_lua 指定真实节点
    upstream ng_dynamic_upstream {
        server 127.0.0.1:1;   # 占位，永远不会被真正访问
        balancer_by_lua_block { require("ng_gateway").balancer() }
        keepalive 32;
    }
}